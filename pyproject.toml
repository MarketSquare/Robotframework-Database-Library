[project]
dynamic = ["version"]

name = "robotframework-databaselibrary"
description = "Database Library for Robot Framework"
readme = "README.md"
authors = [
    {name="Franz Allan Valencia See", email="franz.see@gmail.com"},
    {name="Andre Mochinin"}
]

requires-python = ">=3.8.1"
dependencies = [
    "robotframework>=5.0.1",
    "robotframework-assertion-engine>=3.0.3",
    "sqlparse>=0.5.5",
]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["Robot Framework", "Libraries"]

[project.urls]
"Homepage" = "https://github.com/MarketSquare/Robotframework-Database-Library"
"Keyword docs" = "http://marketsquare.github.io/Robotframework-Database-Library/"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "DatabaseLibrary.version.VERSION"}

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "psycopg2-binary>=2.9.10",
    "robotcode[runner]>=1.9.0",
    "robotframework-excellib>=2.0.1",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
