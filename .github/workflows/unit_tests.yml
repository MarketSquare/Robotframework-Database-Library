---
# This workflow will install Python dependencies
# and run unit tests for given OSes

name: Unit tests

on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-latest'
            python-version: '3.9'
            rf-version: '5.0.1'
          - os: 'ubuntu-latest'
            python-version: '3.10'
            rf-version: '6.1.1'
          - os: 'ubuntu-latest'
            python-version: '3.11'
            rf-version: '6.1.1'
          - os: 'ubuntu-latest'
            python-version: '3.12'
            rf-version: '7.0.1'
          - os: 'ubuntu-latest'
            python-version: '3.13'
            rf-version: '7.2.2'
          - os: 'ubuntu-latest'
            python-version: '3.14'
            rf-version: '7.4.2'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install DatabaseLibrary and dependencies
        run: |
          uv sync --locked --dev

      - name: Install RF specific version and pytest dependencies
        run: |
          uv pip install robotframework==${{ matrix.rf-version }} coverage pytest

      - name: Run unit tests with coverage
        run:
          uv run coverage run -m pytest

      - name: Codecov
        uses: codecov/codecov-action@v3
        with:
          name: ${{ matrix.python-version }}-${{ matrix.os }}-${{ matrix.rf-version }}
